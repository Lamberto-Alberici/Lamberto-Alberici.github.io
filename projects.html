// ─── Build Modal Content ────────────────────────────────────────────────────
function buildSection(title, items) {
  if (!items || items.length === 0) return '';
  const isArr = Array.isArray(items);
  const body = isArr
    ? `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`
    : `<p>${items}</p>`;
  return `<div class="modal-section"><h4>${title}</h4>${body}</div>`;
}

function openModal(project) {
  const badge = project.badge ? `<div class="modal-badge">${project.badge}</div>` : '';
  const tags  = project.tags.map(t => `<span class="modal-tag">${t}</span>`).join('');
  const links = (project.links || []).map(l =>
    `<a href="${l.url}" target="_blank" class="modal-link">${l.label} ↗</a>`).join('');
  const collab = project.collaborators
    ? `<p class="modal-collaborators">In collaboration with ${project.collaborators}</p>` : '';
  const impact = project.impact ? buildSection('Business Impact', project.impact) : '';

  document.getElementById('modalBody').innerHTML = `
    ${badge}
    <h2 class="modal-title">${project.title}</h2>
    <div class="modal-tags">${tags}</div>
    <div class="modal-links">${links}</div>
    ${collab}
    ${buildSection('Overview', project.overview)}
    ${buildSection('Approach', project.approach)}
    ${buildSection('Key Results', project.results)}
    ${impact}
  `;

  const backdrop = document.getElementById('modalBackdrop');
  backdrop.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('active');
  document.body.style.overflow = '';
}

// ─── Render ──────────────────────────────────────────────────────────────────
function render() {
  const featured = projects.find(p => p.featured);
  const rest     = projects.filter(p => !p.featured);

  // Featured card
  if (featured) {
    const tags = featured.tags.map(t => `<span class="card-tag">${t}</span>`).join('');
    const el = document.createElement('div');
    el.className = 'project-featured';
    el.innerHTML = `
      <div class="featured-left">
        <div class="featured-badge">${featured.badge}</div>
        <h2 class="featured-title">${featured.title}</h2>
        <p class="featured-desc">${featured.desc}</p>
        <div class="featured-tags">${tags}</div>
      </div>
      <div class="featured-right">
        <span class="featured-cta">Explore project →</span>
      </div>
    `;
    el.addEventListener('click', () => openModal(featured));
    document.getElementById('featuredSlot').appendChild(el);
  }

  // Regular grid
  const grid = document.getElementById('projectsGrid');
  rest.forEach(project => {
    const tags = project.tags.map(t => `<span class="card-tag">${t}</span>`).join('');
    const card = document.createElement('div');
    card.className = 'project-card';
    card.innerHTML = `
      <div class="card-top">
        <h3 class="card-title">${project.title}</h3>
        <span class="card-arrow">↗</span>
      </div>
      <div class="card-tags">${tags}</div>
    `;
    card.addEventListener('click', () => openModal(project));
    grid.appendChild(card);
  });
}

// ─── Event Listeners ────────────────────────────────────────────────────────
document.getElementById('modalBackdrop').addEventListener('click', e => {
  if (e.target === document.getElementById('modalBackdrop')) closeModal();
});
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

render();
