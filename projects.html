// ─── Render Cards ───────────────────────────────────────────────────────────
function createCard(project) {
  const card = document.createElement('div');
  card.className = 'project-card';
  card.dataset.projectId = project.id;

  const badgeHTML = project.badge
    ? `<div class="card-badge">${project.badge}</div>`
    : '';

  const tagsHTML = project.tags
    .map(t => `<span class="card-tag">${t}</span>`)
    .join('');

  card.innerHTML = `
    ${badgeHTML}
    <div class="card-top">
      <h3 class="card-title">${project.title}</h3>
      <span class="card-arrow">↗</span>
    </div>
    <div class="card-tags">${tagsHTML}</div>
  `;

  card.addEventListener('click', () => openModal(project));
  return card;
}

function renderCards() {
  const baCol = document.getElementById('baColumn');
  const csCol = document.getElementById('csColumn');

  projects.businessAnalytics.forEach(p => baCol.appendChild(createCard(p)));
  projects.computerScience.forEach(p => csCol.appendChild(createCard(p)));
}

// ─── Modal ──────────────────────────────────────────────────────────────────
const backdrop = document.getElementById('modalBackdrop');
const modalBody = document.getElementById('modalBody');

function buildSection(title, items) {
  if (!items || items.length === 0) return '';
  const isArray = Array.isArray(items);
  const content = isArray
    ? `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`
    : `<p>${items}</p>`;
  return `
    <div class="modal-section">
      <h4>${title}</h4>
      ${content}
    </div>
  `;
}

function openModal(project) {
  const badgeHTML = project.badge
    ? `<div class="modal-badge">${project.badge}</div>`
    : '';

  const tagsHTML = project.tags
    .map(t => `<span class="modal-tag">${t}</span>`)
    .join('');

  const linksHTML = (project.links || [])
    .map(l => `<a href="${l.url}" target="_blank" class="modal-link">${l.label} ↗</a>`)
    .join('');

  const collabHTML = project.collaborators
    ? `<p class="modal-collaborators">In collaboration with ${project.collaborators}</p>`
    : '';

  const impactSection = project.impact
    ? buildSection('Business Impact', project.impact)
    : '';

  modalBody.innerHTML = `
    ${badgeHTML}
    <h2 class="modal-title">${project.title}</h2>
    <div class="modal-tags">${tagsHTML}</div>
    <div class="modal-links">${linksHTML}</div>
    ${collabHTML}
    ${buildSection('Overview', project.overview)}
    ${buildSection('Approach', project.approach)}
    ${buildSection('Key Results', project.results)}
    ${impactSection}
  `;

  backdrop.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  backdrop.classList.remove('active');
  document.body.style.overflow = '';
}

// Close on backdrop click (outside modal)
backdrop.addEventListener('click', (e) => {
  if (e.target === backdrop) closeModal();
});

// Close on X button
document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

// Close on Escape key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ─── Init ───────────────────────────────────────────────────────────────────
